description: Discover client-side web vulnerabilities using CodeQL. Limit to "error" level findings, and skip out of scope JS files.

modules:
  - httpx
  - portfilter
  - codeql

config:
  url_querystring_remove: False
  modules:
    excavate:
      retain_querystring: True
    codeql:
      mode: in_scope
      min_severity: error
