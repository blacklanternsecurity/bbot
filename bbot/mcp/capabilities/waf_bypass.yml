description: Find the unprotected origin behind an organization's WAF by reaching its content directly through sibling IPs.

flags:
  # Not optional garnish. The module works by testing whether WAF-protected
  # content can be fetched through IPs belonging to *other* domains the same
  # organization owns, so its hit rate is a direct function of how many sibling
  # domains the scan collected. With one hostname it has nothing to pivot
  # through and will find nothing.
  - subdomain-enum

modules:
  - waf_bypass
  # produces the URL events waf_bypass watches
  - http

exclude_modules:
  # writes third-party Postman workspaces to local disk. A subdomain scan has no
  # business downloading anything.
  - postman_download
  - shodan_idb

config:
  modules:
    waf_bypass:
      similarity_threshold: 0.90
      search_ip_neighbors: true
      # Widest useful sweep: 256 addresses around every IP the scan discovered.
      # Catches an origin parked elsewhere in the hosting range, at the cost of
      # probing addresses whose ownership you have no evidence for. See
      # "when not to use".
      neighbor_cidr: 24

meta:
  # probes 256 addresses around every IP it discovers, most of which belong to
  # other tenants on shared hosting, so the caveat is the difference between authorized and not.
  force_require_tool: true
  accepts:
    # domain-level: it needs the organization, not one host
    - DNS_NAME

  yields:
    - FINDING

  when_not_to_use: |

    Skip it when the target has no WAF.

    Do not run it against a single host. The technique is pivoting through sibling infrastructure, so one domain gives it no candidate IPs and it reports nothing.

    Do not run it under a narrow authorization. At `neighbor_cidr: 24` this probes 256 addresses around every IP it discovers, and on shared or cloud hosting they may belong to other tenants. 

    This is a VERY expensive option. Use it only when a serious vulnerability is present and the only thing protecting it is a WAF.


  how_to_call: |
    Provide intended target along with any other adjacent targets you know about.

    `strict_scope=True` largely defeats the tool: scope expansion is what finds the siblings it pivots through.

    `blacklist` is the safety valve for the neighbour sweep - anything in a shared range that must not be probed goes there.

  interpreting_results: |
    A finding means content served behind the WAF was successfully fetched through an IP that was not supposed to serve it - an origin server reachable directly.

    Verify before reporting. Confirmation is a simhash comparison at 90% similarity, so two pages sharing a template can match without the origin really being exposed.

  
  caveats: |
    WAF detection is tag-based and currently covers CloudFlare and Imperva. A site behind a different provider is not fingerprinted, so it is not tested.

    Only directory URLs are considered; endpoint URLs are skipped.

  examples:
    - description: Look for an exposed origin behind an organization's CDN.
      targets: [evilcorp.com]
    - description: Cover several related domains so the pivot has more IPs to work with.
      targets: [evilcorp.com, evilcorp.net]
