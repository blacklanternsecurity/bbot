description: Find an organization's public repositories, clone them, and scan their full commit history for leaked credentials.

modules:
  - github_org
  - github_codesearch
  - gitlab_com
  - code_repository
  - http
  # clones each discovered repository to local disk. trufflehog in BBOT reads
  # filesystem paths, not remote URLs, so this step is what makes secret
  # scanning possible at all -- there is no version of this tool that does not
  # download.
  - git_clone
  - trufflehog

config:
  modules:
    trufflehog:
      # A secret for an internal or decommissioned service is still a leak and
      # still says the pipeline ships credentials into git. Verified-only would
      # silently drop those.
      only_verified: false

meta:
  accepts:
    - DNS_NAME

  yields:
    - FINDING

  when_not_to_use: |
    Do not run it without somewhere to put the data. Every discovered repository
    is cloned in full, with history. An organization with fifty repositories can
    mean many gigabytes on local disk, and the clone happens before any scanning
    does.

    Think hard about scope. This clones third-party content: repositories
    belonging to the organization, and potentially to its employees personally,
    onto your machine. Authorization to test a company's infrastructure is not
    obviously authorization to do that. Use `find_public_repos` first to see
    what would be cloned before committing to cloning it.

    Use `find_exposed_git` instead when the leak is on the target's own web
    server. That path downloads only the target's own exposed data and has none
    of this ambiguity.

    Expect it to be slow. `git_clone` carries BBOT's `slow` flag, and cloning
    dominates the runtime long before any scanning starts.

  how_to_call: |
    Give it the organization's domains. Discovery runs first, then cloning, then
    scanning - so nothing useful appears for a while and then a lot appears at
    once.

    Run `find_public_repos` first if you have not already. It is cheap, it
    downloads nothing, and it shows you exactly which repositories this tool
    would pull down. Deciding that after seeing the list is much better than
    discovering it during the clone.

    A GitHub API key materially improves coverage; without one,
    `github_codesearch` does not run.

    Clones land in the scan's output directory. Clean them up afterwards - they
    are somebody else's source code sitting on your disk.

    `strict_scope` and `blacklist` do very little here, and it is worth knowing
    why rather than assuming they are a safety net. Discovery happens on GitHub
    and GitLab, not in the target's DNS, so there is no scope expansion for
    `strict_scope` to hold back and no host for `blacklist` to exclude. The way
    to control what gets cloned is to run `find_public_repos` first and look at
    the list.

  interpreting_results: |
    Findings are credentials found anywhere in a repository's history, not just
    in its current files. That is the entire point: a key committed in 2019 and
    removed in 2020 is still in the history, still recoverable by anyone, and
    very often still valid.

    Credentials are reported whether or not they could be verified. Verified
    ones are live and want immediate attention. Unverified ones may be revoked,
    may be internal, may be a test fixture - but they may equally be a key for a
    service the scanner simply could not reach. Check rather than assume.

    Confirm the repository actually belongs to the organization before
    reporting. Discovery is heuristic, and a secret in a stranger's repository
    that merely mentions the domain is not the target's leak.

    Silence here is fairly meaningful. If repositories were discovered and
    cloned and nothing was found, the history is genuinely clean of the patterns
    trufflehog knows.

  caveats: |
    Detection is pattern-based. A credential in an unrecognised format is not
    reported, no matter how long this runs.

    Only public repositories are reachable. Private ones are invisible, which is
    where much of an organization's code lives.

    Attribution is heuristic in both directions: repositories belonging to the
    organization may be missed, and unrelated ones may be cloned.

  examples:
    - description: Hunt an organization's public code history for leaked credentials.
      targets: [evilcorp.com]
    - description: Check a smaller organization where cloning everything is affordable.
      targets: [startup-evilcorp.com]
