description: Find an organization's public repositories, clone them, and scan their full commit history for leaked credentials.

modules:
  - github_org
  - github_codesearch
  - gitlab_com
  - code_repository
  - http
  # clones each discovered repository to local disk. trufflehog in BBOT reads
  # filesystem paths, not remote URLs, so this step is what makes secret
  # scanning possible at all -- there is no version of this tool that does not
  # download.
  - git_clone
  - trufflehog

config:
  modules:
    trufflehog:
      # A secret for an internal or decommissioned service is still a leak and
      # still says the pipeline ships credentials into git. Verified-only would
      # silently drop those.
      only_verified: false
      # One trufflehog subprocess at a time instead of two. Every observed
      # bbot-mcp crash came from a scan with both threads mid-event, and the
      # teardown that follows shuts an executor while modules still hold work.
      # Halving the concurrent subprocesses narrows that window; it does not
      # close it. `concurrency` is deliberately untouched: those are goroutines
      # inside one Go process and never cross the Python boundary.
      module_threads: 1

meta:
  # clones third-party repositories to local disk, potentially including ones
  # belonging to employees personally, so the caveat is the difference between authorized and not.
  force_require_tool: true
  accepts:
    - DNS_NAME

  yields:
    - FINDING

  when_to_use: |
    Finds an organization's public repositories, clones them with full history, and scans every commit
    for credentials. Cloning dominates the runtime - fifty repositories can be many gigabytes - and it
    puts third-party code on local disk, which is why it refuses to run until you have read the detail.
    What it finds is a class of credential no amount of web testing reaches.

  when_not_to_use: |
    Clones every discovered repository in full, with history. Fifty repositories can mean many gigabytes, and cloning dominates the runtime.

    This puts third-party code on your machine, including repositories belonging to employees personally. Authorization to test a company may not cover that.

    Use `find_exposed_git` when the leak is on the target's own web server.

  how_to_call: |
    Provide domains (single or list). Run `find_public_repos` first to see what would be cloned.

    A GitHub API key materially improves coverage; without one `github_codesearch` does not run.

    Clones land in the scan's output directory. Clean them up afterwards.

  interpreting_results: |
    Findings are credentials from anywhere in a repository's history, not just its current files. A key committed and later removed is still recoverable, and often still valid.

    Credentials are reported whether or not they could be verified. An unverified one may be revoked, or may be live for a service the scanner could not reach.

    Confirm the repository belongs to the organization before reporting.

  caveats: |
    Detection is pattern-based. A credential in an unrecognised format is not reported.

    Only public repositories are reachable.

    Attribution is heuristic in both directions.

  examples:
    - description: Hunt an organization's public code history for leaked credentials.
      targets: [evilcorp.com]
    - description: Check a smaller organization where cloning everything is affordable.
      targets: [startup-evilcorp.com]
