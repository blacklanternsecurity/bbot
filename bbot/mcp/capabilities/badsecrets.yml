description: Find known or weak cryptographic secrets in a web application - signed cookies, viewstates, JWTs and framework keys.

include:
  # badsecrets reads HTTP responses, so it only sees pages something fetched.
  # Framework secrets tend to sit on login, error and admin pages rather than
  # the homepage, which is exactly what a crawl reaches and a seed URL does not.
  - spider

modules:
  - badsecrets

meta:
  accepts:
    - URL

  yields:
    - FINDING

  when_not_to_use: |
    Skip it when the target is not a web application. It reads HTTP responses
    and has nothing to say about a bare domain, a host with no web service, or
    an IP range.

    Skip it when you have already run `lightfuzz`, `lightfuzz_deep`, or a .NET
    or JavaScript audit against the same hosts. All of them already include
    badsecrets, so running it separately re-covers ground.

    It will not find a secret on a page nothing fetched. If the interesting part
    of the application is behind a login, or is an API that returns no signed
    material, there is nothing here for it.

  how_to_call: |
    Give it URLs. The crawl walks out two links deep and four directories down
    from each one, so an application's entry point is usually enough; you do not
    need to enumerate pages yourself.

    This is the least intrusive web tool here. It sends no payloads and changes
    nothing: it browses like a user and inspects what comes back. That makes it
    reasonable to run early, and reasonable to run where a fuzzer would not be
    welcome.

    Scope behaves as everywhere else. BBOT treats everything under a target as
    in-scope, so a URL on `app.evilcorp.com` covers that host and what it links
    to beneath it; `strict_scope=True` holds it to the exact URLs you gave.
    `blacklist` overrides scope and is worth setting for anything the crawler
    should not touch, though the spider already avoids sign-out and log-out
    links so it does not end its own session.

  interpreting_results: |
    A finding here means a real secret was recognised, not that one might exist.
    badsecrets matches against known and leaked keys, so a hit is a key that is
    public knowledge and the application is still trusting it.

    Read what the secret protects, because impact varies enormously. A signed
    cookie with a cracked key usually means session forgery and often privilege
    escalation. An ASP.NET viewstate signed with a known machineKey is
    frequently remote code execution. A JWT with a guessable secret means you
    can mint tokens. The finding names the framework and the mechanism; that is
    what determines severity, not the severity field alone.

    Silence is meaningful here in a way it is not for a fuzzer. This checks
    against a fixed set of known-bad keys, so no finding means none of those
    keys are in use. It does not mean the application's own secret is strong.

  caveats: |
    Coverage is the contents of the badsecrets library. A weak but unpublished
    key will not be recognised, so this is a check for known-bad secrets rather
    than an audit of secret strength.

    It only inspects what was fetched. Anything requiring authentication, or any
    endpoint the crawl did not reach, is untested.

  examples:
    - description: Check an application for known framework secrets before doing anything noisier.
      targets: ["https://app.evilcorp.com/"]
    - description: Check several applications in one pass.
      targets: ["https://app.evilcorp.com/", "https://portal.evilcorp.com/"]
