description: Find known or weak cryptographic secrets in a web application - signed cookies, viewstates, JWTs and framework keys.

include:
  # badsecrets reads HTTP responses, so it only sees pages something fetched.
  # Framework secrets tend to sit on login, error and admin pages rather than
  # the homepage, which is exactly what a crawl reaches and a seed URL does not.
  - spider

modules:
  - badsecrets

meta:
  accepts:
    - URL

  yields:
    - FINDING

  when_not_to_use: |
    Skip it when the target is not a web application. It reads HTTP responses.

    Skip it when you have already run `lightfuzz`, `lightfuzz_deep`, or a .NET or JavaScript audit against the same hosts - all of them include badsecrets.

    It will not find a secret on a page nothing fetched. Material behind a login is out of reach.

  how_to_call: |
    Give it URLs. The crawl walks two links deep and four directories down, so an entry point is usually enough.

    Least intrusive web tool here. Sends no payloads and changes nothing.

    The spider already avoids sign-out and log-out links.

  interpreting_results: |
    A finding means a real secret was recognised by examining a cryptographic product produced by it. The key was either publicly known or very weak.

    Impact varies by mechanism. A signed cookie leads to session forgery, an ASP.NET viewstate signed with a known machineKey is RCE, a JWT with a guessable secret means you can mint tokens. The finding names the framework and the mechanism; that is what determines severity.

  caveats: |
    Only inspects what was fetched. Anything requiring authentication, or any endpoint the crawl did not reach, is untested.

  examples:
    - description: Check an application for known framework secrets before doing anything noisier.
      targets: ["https://app.evilcorp.com/"]
    - description: Check several applications in one pass.
      targets: ["https://app.evilcorp.com/", "https://portal.evilcorp.com/"]
