[tool.poetry]
name = "bbot"
version = "2.3.0"
description = "OSINT automation for hackers."
authors = [
    "TheTechromancer",
    "Paul Mueller",
]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/blacklanternsecurity/bbot"
homepage = "https://github.com/blacklanternsecurity/bbot"
documentation = "https://www.blacklanternsecurity.com/bbot/"
keywords = ["python", "cli", "automation", "osint", "threat-intel", "intelligence", "neo4j", "scanner", "python-library", "hacking", "recursion", "pentesting", "recon", "command-line-tool", "bugbounty", "subdomains", "security-tools", "subdomain-scanner", "osint-framework", "attack-surface", "subdomain-enumeration", "osint-tool"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[tool.poetry.urls]
"Discord" = "https://discord.com/invite/PZqkgxu5SA"
"Docker Hub" = "https://hub.docker.com/r/blacklanternsecurity/bbot"

[tool.poetry.scripts]
bbot = 'bbot.cli:main'

[tool.poetry.dependencies]
python = "^3.9"
omegaconf = "^2.3.0"
psutil = ">=5.9.4,<7.0.0"
wordninja = "^2.0.0"
ansible-runner = "^2.3.2"
deepdiff = ">=6.2.3,<8.0.0"
xmltojson = "^2.0.2"
pycryptodome = "^3.17"
idna = "^3.4"
ansible = ">=7.3,<9.0"
tabulate = "0.8.10"
websockets = ">=11.0.2,<13.0.0"
pyjwt = "^2.7.0"
beautifulsoup4 = "^4.12.2"
lxml = ">=4.9.2,<6.0.0"
dnspython = "^2.4.2"
pydantic = "^2.4.2"
tldextract = "^5.1.1"
cachetools = "^5.3.2"
socksio = "^1.0.0"
jinja2 = "^3.1.3"
regex = "^2024.4.16"
unidecode = "^1.3.8"
mmh3 = ">=4.1,<6.0"
setproctitle = "^1.3.3"
yara-python = "^4.5.1"
pyzmq = "^26.0.3"
httpx = "^0.27.0"
puremagic = "^1.28"
cloudcheck = "^6.0.0.602"
radixtarget = "^2.0.0.50"

[tool.poetry.group.dev.dependencies]
poetry-dynamic-versioning = ">=0.21.4,<1.5.0"
urllib3 = "^2.0.2"
werkzeug = ">=2.3.4,<4.0.0"
pytest-env = ">=0.8.2,<1.2.0"
pre-commit = ">=3.4,<5.0"
pytest-cov = ">=5,<7"
pytest-rerunfailures = ">=14,<16"
pytest-timeout = "^2.3.1"
pytest-httpserver = "^1.0.11"
pytest = "^8.3.1"
pytest-asyncio = "0.24.0"
uvicorn = "^0.32.0"
fastapi = "^0.115.5"
pytest-httpx = ">=0.33,<0.35"
ruff = "^0.8.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.2"
mkdocs-extra-sass-plugin = "^0.1.0"
mkdocs-material = "^9.2.5"
mkdocs-material-extensions = "^1.1.1"
mkdocstrings = ">=0.22,<0.28"
mkdocstrings-python = "^1.6.0"
livereload = "^2.6.3"
mike = "^2.1.2"

[tool.pytest.ini_options]
env = [
    "BBOT_TESTING = True",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.codespell]
ignore-words-list = "bu,cna,couldn,dialin,nd,ned,thirdparty"
skip = "./docs/javascripts/vega*.js,./bbot/wordlists/*"

[tool.ruff]
line-length = 119
format.exclude = ["bbot/test/test_step_1/test_manager_*"]

[tool.ruff.lint]
ignore = ["E402", "E501", "E721", "E741", "F401", "F403", "F405"]
mccabe.max-complexity = 31
select = [
  "AIR",     # Airflow
  "C4",      # flake8-comprehensions
  "C90",     # McCabe cyclomatic complexity
  "DJ",      # flake8-django
  "E",       # pycodestyle
  "F",       # Pyflakes
  "FAST",    # FastAPI
  "FLY",     # flynt
  "ICN",     # flake8-import-conventions
  "INT",     # flake8-gettext
  "LOG",     # flake8-logging
  "NPY",     # NumPy-specific rules
  "PD",      # pandas-vet
  "PLR091",  # Pylint Refactor just for max-args, max-branches, etc.
  "PYI",     # flake8-pyi
  "RSE",     # flake8-raise
  "SLOT",    # flake8-slots
  "T10",     # flake8-debugger
  "TC",      # flake8-type-checking
  "W",       # pycodestyle
  "YTT",     # flake8-2020
  # "A",     # flake8-builtins
  # "ANN",   # flake8-annotations
  # "ARG",   # flake8-unused-arguments
  # "ASYNC", # flake8-async
  # "B",     # flake8-bugbear
  # "BLE",   # flake8-blind-except
  # "COM",   # flake8-commas
  # "CPY",   # flake8-copyright
  # "D",     # pydocstyle
  # "DOC",   # pydoclint
  # "DTZ",   # flake8-datetimez
  # "EM",    # flake8-errmsg
  # "ERA",   # eradicate
  # "EXE",   # flake8-executable
  # "FA",    # flake8-future-annotations
  # "FBT",   # flake8-boolean-trap
  # "FIX",   # flake8-fixme
  # "FURB",  # refurb
  # "G",     # flake8-logging-format
  # "I",     # isort
  # "INP",   # flake8-no-pep420
  # "ISC",   # flake8-implicit-str-concat
  # "N",     # pep8-naming
  # "PERF",  # Perflint
  # "PGH",   # pygrep-hooks
  # "PIE",   # flake8-pie
  # "PL",    # Pylint
  # "PT",    # flake8-pytest-style
  # "PTH",   # flake8-use-pathlib
  # "Q",     # flake8-quotes
  # "RET",   # flake8-return
  # "RUF",   # Ruff-specific rules
  # "S",     # flake8-bandit
  # "SIM",   # flake8-simplify
  # "SLF",   # flake8-self
  # "T20",   # flake8-print
  # "TD",    # flake8-todos
  # "TID",   # flake8-tidy-imports
  # "TRY",   # tryceratops
  # "UP",    # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"bbot/test/test_step_1/test_*" = ["PLR0915"]

[tool.ruff.lint.pylint]
max-args = 21  # Default is 5
max-branches = 31  # Default is 12
max-returns = 10  # Default is 6
max-statements = 100  # Default is 50

[tool.poetry-dynamic-versioning]
enable = true
metadata = false
format-jinja = 'v2.3.0{% if branch == "dev" %}.{{ distance }}rc{% endif %}'

[tool.poetry-dynamic-versioning.substitution]
files = ["*/__init__.py"]
