name: CLA

# The CLA bot needs both triggers; cla-reusable.yml never checks out pull request code.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed, synchronize]

permissions:
  pull-requests: write
  statuses: write

jobs:
  cla:
    uses: blacklanternsecurity/release-workflows/.github/workflows/cla-reusable.yml@51163e239ec33485742e0639588e3051d65022fa # v1.4.0
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
