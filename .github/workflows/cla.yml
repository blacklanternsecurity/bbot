name: CLA

# The CLA bot needs both triggers; cla-reusable.yml never checks out pull request code.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed, synchronize]

permissions:
  pull-requests: write
  statuses: write

jobs:
  cla:
    uses: blacklanternsecurity/release-workflows/.github/workflows/cla-reusable.yml@4f32510b1cdfe7305aa27daa3f6fd72e4c03c21b # v1.5.0
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
