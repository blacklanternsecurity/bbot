name: docker dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: blacklanternsecurity/release-workflows/.github/workflows/docker-dev.yml@51163e239ec33485742e0639588e3051d65022fa # v1.4.0
    with:
      image: ${{ github.repository }}
