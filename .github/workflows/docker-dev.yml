name: docker dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: blacklanternsecurity/CLA/.github/workflows/docker-dev.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11
    with:
      image: ${{ github.repository }}
