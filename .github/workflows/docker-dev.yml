name: docker dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: blacklanternsecurity/release-workflows/.github/workflows/docker-dev.yml@3fe35ff9c43f61c98bd8c93182686b6be97d2759 # v1.3.0
    with:
      image: ${{ github.repository }}
