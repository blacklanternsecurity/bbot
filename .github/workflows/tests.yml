name: Tests
on:
  push:
    branches:
      - dev
  pull_request:
  workflow_call:
    secrets:
      BBOT_IO_API_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.code != 'false' || github.event.pull_request.changed_files >= 3000) }}
    uses: blacklanternsecurity/release-workflows/.github/workflows/python-tests.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    secrets:
      BBOT_IO_API_KEY: ${{ secrets.BBOT_IO_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      uv-sync-args: --group dev
      setup-script: bbot/test/ci_workers.sh
      pytest-args: -vv --dist loadgroup --reruns 2 -o timeout_func_only=true --timeout 1200 --disable-warnings --log-cli-level=INFO --cov-config=bbot/test/coverage.cfg --cov-report xml:cov.xml --cov=bbot .
      secret-env: '["BBOT_IO_API_KEY"]'
      coverage: true
      artifacts: pytest_debug.log

  test_matrix:
    name: test matrix passed
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every dependency succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: changes, test
          jobs: ${{ toJSON(needs) }}
