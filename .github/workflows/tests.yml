name: Tests
on:
  push:
    branches:
      - dev
  pull_request:
  workflow_call:
    secrets:
      BBOT_IO_API_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.code != 'false' || github.event.pull_request.changed_files >= 3000) }}
    uses: blacklanternsecurity/release-workflows/.github/workflows/python-tests.yml@4f32510b1cdfe7305aa27daa3f6fd72e4c03c21b # v1.5.0
    secrets:
      BBOT_IO_API_KEY: ${{ secrets.BBOT_IO_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      uv-sync-args: --group dev
      setup-script: bbot/test/ci_workers.sh
      pytest-args: -vv --dist loadgroup --reruns 2 -o timeout_func_only=true --timeout 1200 --disable-warnings --log-cli-level=INFO --cov-config=bbot/test/coverage.cfg --cov-report xml:cov.xml --cov=bbot .
      secret-env: '["BBOT_IO_API_KEY"]'
      coverage: true
      github-token: true
      artifacts: pytest_debug.log

  # A Markdown-only PR skips the suite, but test_docs reads every .md file for BBOT module
  # markers, so a docs PR with a bad marker would break every later push. Run it on its own.
  docs:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'false' && github.event.pull_request.changed_files < 3000 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --group dev
      - run: uv run --no-sync pytest -q bbot/test/test_step_1/test_docs.py

  test_browser:
    name: browser tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.code != 'false' || github.event.pull_request.changed_files >= 3000) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      # the browser is a >1GB download; keep the installed copy between runs
      - name: Cache browser install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bbot/test-browser
          key: bbot-test-browser-${{ hashFiles('bbot/core/helpers/web/browser/engines/*.py') }}
      - name: Run browser tests
        env:
          BBOT_TEST_BROWSER: "1"
        run: uv run --no-sync pytest -vv -m browser --reruns 2 -o timeout_func_only=true --timeout 1200 --disable-warnings --log-cli-level=INFO .
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-debug-logs-browser
          path: pytest_debug.log

  test_matrix:
    name: test matrix passed
    if: always()
    needs: [changes, test, test_browser, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every dependency succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: changes, test, test_browser, docs
          jobs: ${{ toJSON(needs) }}
