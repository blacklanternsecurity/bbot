name: publish

on:
  push:
    branches: [stable]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/release-check.yml@3fe35ff9c43f61c98bd8c93182686b6be97d2759 # v1.3.0
    secrets:
      BLS_RELEASE_PRIVATE_KEY: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}
    with:
      image: ${{ github.repository }}

  tests:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository]
    secrets:
      BBOT_IO_API_KEY: ${{ secrets.BBOT_IO_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docker:
    # After build: no image is pushed for a version whose package didn't build.
    needs: [check, tests, build]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/docker.yml@3fe35ff9c43f61c98bd8c93182686b6be97d2759 # v1.3.0
    with:
      image: ${{ github.repository }}
      version: ${{ needs.check.outputs.version }}
      major: ${{ needs.check.outputs.major }}
      minor: ${{ needs.check.outputs.minor }}
      description: true
    # docker.yml logs in from a release-environment job, which receives an environment secret only
    # when the caller maps it by name (as check and release do for BLS_RELEASE_PRIVATE_KEY).
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  pypi:
    needs: [build, docker]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  release:
    needs: [check, docker, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: blacklanternsecurity/release-workflows/.github/workflows/publish.yml@3fe35ff9c43f61c98bd8c93182686b6be97d2759 # v1.3.0
    secrets:
      BLS_RELEASE_PRIVATE_KEY: ${{ secrets.BLS_RELEASE_PRIVATE_KEY }}
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      images: ${{ needs.docker.outputs.images }}
