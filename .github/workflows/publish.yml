name: publish

on:
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: blacklanternsecurity/CLA/.github/workflows/release-check.yml@4894c4adb0c98b978c7c621903e1f3205fc446b7 # CLA#11

  tests:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  pypi:
    needs: docker
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  docker:
    needs: [check, tests]
    if: needs.check.outputs.release == 'true'
    uses: blacklanternsecurity/CLA/.github/workflows/docker.yml@4894c4adb0c98b978c7c621903e1f3205fc446b7 # CLA#11
    secrets: inherit
    with:
      image: ${{ github.repository }}
      version: ${{ needs.check.outputs.version }}
      major: ${{ needs.check.outputs.major }}
      minor: ${{ needs.check.outputs.minor }}
      description: true

  release:
    needs: [check, docker, pypi]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: blacklanternsecurity/CLA/.github/workflows/publish.yml@4894c4adb0c98b978c7c621903e1f3205fc446b7 # CLA#11
    with:
      release-app-id: ${{ vars.RELEASE_APP_ID }}
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      images: ${{ needs.docker.outputs.images }}
    secrets:
      release-app-key: ${{ secrets.RELEASE_APP_KEY }}
